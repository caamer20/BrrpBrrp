name: brrpbrrp

services:
  brrpbrrp:
    image: brrpbrrp:local
    build:
      context: .
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      BRRP_DATA_DIR: /data
      BRRP_ADDR: ":8082"
      BRRP_BASE_URL: ${BRRP_BASE_URL:-https://localhost:8082}
      BRRP_TLS_MODE: ${BRRP_TLS_MODE:-auto}
      BRRP_BEHIND_PROXY: ${BRRP_BEHIND_PROXY:-false}
      BRRP_TRUSTED_PROXIES: ${BRRP_TRUSTED_PROXIES:-}
      BRRP_ALLOW_INSECURE_HTTP: "false"
      BRRP_DOMAIN: ${BRRP_DOMAIN:-}
      BRRP_ACME_EMAIL: ${BRRP_ACME_EMAIL:-}
      BRRP_CERT_FILE: ${BRRP_CERT_FILE:-certs/tls.crt}
      BRRP_KEY_FILE: ${BRRP_KEY_FILE:-certs/tls.key}
      BRRP_VOICE_EXTERNAL_IP: ${BRRP_VOICE_EXTERNAL_IP:-}
      BRRP_VOICE_PORT_MIN: "50000"
      BRRP_VOICE_PORT_MAX: "50100"
      # Both conversation features are on unless .env.docker switches one off.
      BRRP_ENABLE_PRIVATE_CONVERSATIONS: ${BRRP_ENABLE_PRIVATE_CONVERSATIONS:-true}
      # An unset variable and an empty one mean the same thing to the server: an empty
      # value falls back to the built-in default. Passing each as ${NAME:-} therefore
      # preserves today's behaviour for an operator who sets nothing, while making a key
      # written into .env.docker actually take effect. scripts/check-compose-env.mjs keeps
      # this list complete against the keys the server reads.
      BRRP_ENABLE_RESTRICTED_CHANNELS: ${BRRP_ENABLE_RESTRICTED_CHANNELS:-true}
      BRRP_LOGIN_ATTEMPTS: ${BRRP_LOGIN_ATTEMPTS:-}
      BRRP_MAX_UPLOAD_BYTES: ${BRRP_MAX_UPLOAD_BYTES:-}
      BRRP_STORAGE_QUOTA_BYTES: ${BRRP_STORAGE_QUOTA_BYTES:-}
      BRRP_STORAGE_RESERVE_BYTES: ${BRRP_STORAGE_RESERVE_BYTES:-}
      BRRP_SQLITE_SYNCHRONOUS: ${BRRP_SQLITE_SYNCHRONOUS:-}
      BRRP_ALERT_WEBHOOK: ${BRRP_ALERT_WEBHOOK:-}
      BRRP_ALERT_SECRET: ${BRRP_ALERT_SECRET:-}
      BRRP_LOG_LEVEL: ${BRRP_LOG_LEVEL:-info}
    ports:
      - "${BRRP_BIND_IP:-127.0.0.1}:${BRRP_WEB_PORT:-8082}:8082/tcp"
      - "${BRRP_MEDIA_BIND_IP:-0.0.0.0}:50000-50100:50000-50100/udp"
    volumes:
      - brrpbrrp-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  brrpbrrp-data:
