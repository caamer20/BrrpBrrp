name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  audit:
    name: Frontend and static audits
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Frontend checks
        working-directory: web
        run: npm audit --audit-level=moderate && npm run check && npm run format:check && npm test
      - name: Go vulnerability audit
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Static and workflow failure controls
        run: |
          node scripts/ci-audit.mjs
          node scripts/check-browser-steps.mjs --self-test
          node scripts/check-browser-steps.mjs
      - name: Scan reachable history for new secrets
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          /tmp/gitleaks-bin/gitleaks git . --log-opts=--all --redact=100 --no-banner
  native:
    needs: audit
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build and test on this platform
        run: |
          go build ./cmd/brrpbrrp
          go test -count=1 -timeout 45m ./...
