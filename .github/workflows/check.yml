name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go vet ./...
      # The API package alone takes just over 20 minutes under -race on this
      # suite, so a 20m budget failed intermittently with "test timed out" rather
      # than reporting a real failure. The margin here is deliberate: a timeout
      # that races the runtime hides the signal it exists to provide.
      - run: go test -race -timeout 40m ./...
      - run: go build ./cmd/brrpbrrp
      # The released binary redistributes these dependencies, so the notices must
      # match them: a stale file or an unreadable license fails here.
      - run: node scripts/licenses.mjs --check
      # The Docker image cannot be built on every host, so its inputs are audited
      # statically here; --self-test proves the audit still detects the defect it was
      # written for.
      - run: node scripts/check-docker-inputs.mjs
      - run: node scripts/check-docker-inputs.mjs --self-test
      # The source package must contain every document it links to, every script its
      # Makefile runs and every Docker build input, and must exclude the operator's own
      # host notes.
      - run: node scripts/check-source-package.mjs
      # Every shipped script is parsed, not just the ones a job happens to run. A
      # script with a syntax error is otherwise found by whoever runs it next, on
      # their machine, at the moment they need it — which for the capacity and alert
      # tooling is exactly the moment they are trying to measure a real deployment.
      # A broken link in a README is not cosmetic: it is the one place somebody who has
      # never seen this repository is told where to go next, and a link to a renamed
      # document sends them nowhere.
      - name: Documentation links resolve
        run: node scripts/check-doc-links.mjs
      # The schema number is read from the migration registry rather than trusted from
      # prose. Three documents tell an operator what schema the release writes, and all
      # three were stale — an operator reading one to decide whether a backup can be
      # restored afterwards is reading something that has already gone wrong.
      - name: Documentation states the schema this binary writes
        run: node scripts/check-schema-docs.mjs
      - name: Every shipped script parses
        run: |
          status=0
          for script in scripts/*.mjs; do
            if ! node --check "$script"; then
              echo "::error::$script does not parse"
              status=1
            fi
          done
          exit $status
      # The capacity and alert tooling runs against a live server, so CI cannot run it
      # — but it can refuse to let the files rot: a fixture generator whose routes or
      # the server's response shape drift from the product will still start, and fail
      # against a real deployment rather than in a check.
      - name: The capacity fixture names routes the product serves
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const router = readFileSync("internal/api/router.go", "utf8");
            for (const route of ["/api/channels", "/api/channels/{id}/messages", "/api/directs", "/api/admin/users", "/api/search"]) {
              if (!router.includes(route)) {
                console.error("::error::the capacity tooling names " + route + ", which the router does not serve");
                process.exit(1);
              }
            }
            console.log("capacity fixture routes match the product");
          '
  browser:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=moderate
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: mkdir -p dist && go build -o dist/brrpbrrp-e2e ./cmd/brrpbrrp
      # The browser-step audit executes shell command lines and writes a POSIX
      # stub to a PATH, so it runs here in the Linux job that owns the browser
      # steps rather than in the cross-platform matrix. Running it on Windows
      # would either need real portability work or would degrade to a skip that
      # looks like a pass (completion review 10, R10-05). The Windows build and
      # test matrix above is unchanged.
      - run: node scripts/check-browser-steps.mjs --self-test
      - run: node scripts/check-browser-steps.mjs
      # Both feature gates are required: the default-off suite proves the shipped
      # default, and the opted-in suite must visibly include the direct-message
      # journeys. A run that silently skipped them would pass nothing extra.
      #
      # `shell: bash` is declared, not left to the runner's default. The default
      # Linux shell is `bash -e`, which has no pipefail, so `npm run test:e2e |
      # tee` reported tee's status and a failing suite that still printed its
      # project names — including the `[directs]` the grep below looks for — left
      # this required job green (completion review 9, R9-01). `shell: bash` is
      # `bash --noprofile --norc -eo pipefail`, so the test process's own exit
      # status fails the step. scripts/check-browser-steps.mjs audits that
      # property and proves it by running these step bodies against a failing
      # stub; it is not a substitute for this job actually running.
      - name: Browser journeys (default feature set)
        working-directory: web
        shell: bash
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: report-default
        run: |
          npm run test:e2e 2>&1 | tee browser-default.log
          mv test-results test-results-default 2>/dev/null || true
      - name: Browser journeys (private conversations enabled)
        working-directory: web
        shell: bash
        env:
          BRRP_E2E_PRIVATE_CONVERSATIONS: '1'
          PLAYWRIGHT_HTML_OUTPUT_DIR: report-private
        run: |
          npm run test:e2e 2>&1 | tee browser-private.log
          test -d test-results && mv test-results test-results-private || true
          grep -q '\[directs\]' browser-private.log || { echo 'FAIL: the opted-in run never executed the directs project'; exit 1; }
      # `if: always()`, and the original paths are collected as well as the
      # renamed ones. With pipefail the run body stops at the failing pipeline,
      # so the `mv` above never happens and a failed run leaves its artifacts
      # under test-results/; uploading only the renamed directories would
      # discard exactly the traces, screenshots and logs a failure produces.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-report
          if-no-files-found: warn
          path: |
            web/report-default/
            web/report-private/
            web/browser-default.log
            web/browser-private.log
            web/test-results/
            web/test-results-default/
            web/test-results-private/
  docker:
    uses: ./.github/workflows/docker.yml
  # Fresh-recovery and extracted-consumer execution are required on every push — a
  # static file-list check alone is not recovery or packaging evidence (review 8,
  # R8-04). The cross-version upgrade/rollback gate runs with the packaging trigger
  # and REQUIRES the pinned archived releases; with no approved artifact source
  # configured it fails loudly instead of silently skipping (see
  # scripts/baseline-releases.json).
  recovery:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - name: Build the candidate
        run: mkdir -p dist check-results && go build -trimpath -ldflags="-s -w" -o dist/brrpbrrp-recovery ./cmd/brrpbrrp
      - name: Fresh recovery rehearsal (community fixture)
        run: node scripts/upgrade-recovery.mjs --binary "$(pwd)/dist/brrpbrrp-recovery" --report check-results/recovery.json
      - name: Fresh recovery rehearsal (private-state fixture)
        run: node scripts/upgrade-recovery-private.mjs --binary "$(pwd)/dist/brrpbrrp-recovery" --report check-results/recovery-private.json
      # The schema-13 rehearsal needs a schema-13 data directory, and only a real
      # schema-13 executable can write one: a current binary produces a current
      # database, and the rehearsal's own checks reject that. The seed is therefore
      # built by a schema-13 executable acquired from the operator's approved host and
      # verified against the digest provided with it.
      #
      # Nothing here names a version: the version was never the identity. The
      # rehearsal's `--make-seed` verifies the executable's SHA256 against
      # scripts/schema13-baselines.json for this platform and refuses a mismatch or a
      # platform with no recorded identity (review 17, V17-05). The linux-amd64 entry
      # is deliberately null until a hosted archive is acquired and its identity
      # recorded; this step therefore fails with that exact instruction rather than
      # seeding from the wrong bytes or silently skipping.
      - name: Build the schema-13 upgrade seed from the verified baseline
        env:
          SCHEMA13_BASELINE_URL: ${{ vars.BRRP_SCHEMA13_BASELINE_URL }}
          SCHEMA13_BASELINE_SHA256: ${{ vars.BRRP_SCHEMA13_BASELINE_SHA256 }}
        run: |
          if [ -z "${SCHEMA13_BASELINE_URL}" ] || [ -z "${SCHEMA13_BASELINE_SHA256}" ]; then
            echo "No schema-13 baseline is configured for this repository." >&2
            echo "Acquire the archived linux/amd64 schema-13 release from the approved host," >&2
            echo "set BRRP_SCHEMA13_BASELINE_URL and BRRP_SCHEMA13_BASELINE_SHA256 as repository" >&2
            echo "variables, and record its sha256 and embedded revision under linux-amd64 in" >&2
            echo "scripts/schema13-baselines.json. Then this step and the rehearsal can run." >&2
            exit 1
          fi
          mkdir -p /tmp/brrp-s13 && rm -rf /tmp/brrp-s13/*
          curl -fsSL "${SCHEMA13_BASELINE_URL}" -o /tmp/brrp-s13/baseline.zip
          echo "${SCHEMA13_BASELINE_SHA256}  /tmp/brrp-s13/baseline.zip" | sha256sum -c -
          unzip -q /tmp/brrp-s13/baseline.zip -d /tmp/brrp-s13
          old_binary="$(find /tmp/brrp-s13 -maxdepth 3 -type f -name brrpbrrp | head -1)"
          if [ -z "${old_binary}" ]; then
            echo "the downloaded archive contains no brrpbrrp executable" >&2
            exit 1
          fi
          node scripts/upgrade-schema13-private.mjs --make-seed /tmp/brrp-s13/data --old-binary "${old_binary}" --report check-results/schema13-seed.json
      - name: Schema-13 upgrade rehearsal
        run: node scripts/upgrade-schema13-private.mjs --seed-dir /tmp/brrp-s13/data --binary "$(pwd)/dist/brrpbrrp-recovery" --report check-results/schema13.json
      - name: Package one native and one source archive
        run: go run scripts/release.go -targets linux/amd64 -version 0.0.0-ci.${{ github.sha }}
      - name: Consume the extracted native package
        run: |
          mkdir -p /tmp/brrp-consumer && rm -rf /tmp/brrp-consumer/*
          unzip -q "dist/releases/brrpbrrp-0.0.0-ci.${{ github.sha }}-linux-amd64.zip" -d /tmp/brrp-consumer
          node scripts/check-package.mjs /tmp/brrp-consumer/brrpbrrp
      - name: Consume the extracted source package
        run: |
          mkdir -p /tmp/brrp-source && rm -rf /tmp/brrp-source/*
          unzip -q "dist/brrpbrrp-docker-source-0.0.0-ci.${{ github.sha }}.zip" -d /tmp/brrp-source
          cd /tmp/brrp-source
          npm ci --prefix web
          npm run build --prefix web
          go build -trimpath -o /tmp/brrp-source-built ./cmd/brrpbrrp
          cd "$GITHUB_WORKSPACE"
          node scripts/check-package.mjs /tmp/brrp-source-built
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-reports
          path: check-results/*.json
  rollback:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - name: Build the candidate
        run: mkdir -p dist check-results && go build -trimpath -ldflags="-s -w" -o dist/brrpbrrp-recovery ./cmd/brrpbrrp
      # BRRP_BASELINE_RELEASE_URL is a repository/organization variable pointing at
      # the approved archive host. Without it the fetch fails and the gate cannot
      # pass, which is deliberate: an unverifiable baseline is not a rollback test.
      - name: Stage the pinned archived releases
        env:
          BRRP_BASELINE_RELEASE_URL: ${{ vars.BRRP_BASELINE_RELEASE_URL }}
        run: |
          node scripts/fetch-baseline-release.mjs --self-test
          node scripts/fetch-baseline-release.mjs --version 0.4.0-alpha.5 --platform linux/amd64
          node scripts/fetch-baseline-release.mjs --version 0.4.0-alpha.3 --platform linux/amd64
      - name: Upgrade/rollback against the packaged checkpoint
        run: node scripts/upgrade-rollback.mjs --binary "$(pwd)/dist/brrpbrrp-recovery" --old-release "$(pwd)/dist/releases/brrpbrrp-0.4.0-alpha.5-linux-amd64.zip" --report check-results/rollback-alpha5.json
      - name: Upgrade/rollback against the legacy baseline
        run: node scripts/upgrade-rollback.mjs --binary "$(pwd)/dist/brrpbrrp-recovery" --old-release "$(pwd)/dist/releases/brrpbrrp-0.4.0-alpha.3-linux-amd64.zip" --report check-results/rollback-alpha3.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rollback-reports
          path: check-results/*.json
  # The single promotion gate: native packages are built only when the OS matrix,
  # both browser feature modes, the Docker image and container lifecycle check, the
  # recovery/consumer executions and the cross-version rollback gate have all
  # passed. Previously the Docker checks lived in a separate workflow and nothing
  # joined them to a promotion decision (completion review F-15).
  packages:
    if: github.event_name == 'workflow_dispatch'
    needs: [test, browser, docker, recovery, rollback]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: go mod download
      - run: go run scripts/release.go
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brrpbrrp-native-packages
          path: dist/releases/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brrpbrrp-docker-source
          path: |
            dist/brrpbrrp-docker-source-*.zip
            dist/DOCKER-SOURCE-SHA256SUMS
