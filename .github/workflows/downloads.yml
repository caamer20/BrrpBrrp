name: Release download count
on:
  schedule:
    - cron: '23 3 * * *'
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-download-count
  cancel-in-progress: false
jobs:
  badge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Read all published release archives
        run: node scripts/update-download-badge.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save the count when it changes
        run: |
          if git diff --quiet -- docs/assets/downloads.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/assets/downloads.svg
          git commit -m 'Update release download count [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
