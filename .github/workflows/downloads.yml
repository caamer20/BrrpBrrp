name: Release download count
on:
  schedule:
    - cron: '23 3 * * *'
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-download-count
  cancel-in-progress: false
jobs:
  badge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Read all published release archives
        run: node scripts/update-download-badge.mjs --output /tmp/brrpbrrp-downloads.svg
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check out the badge branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: badges
          path: badge
      - name: Save the count outside protected main
        working-directory: badge
        shell: bash
        run: |
          cp /tmp/brrpbrrp-downloads.svg downloads.svg
          if git diff --quiet -- downloads.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- downloads.svg
          git commit -m 'Update release download count [skip ci]'
          git push origin HEAD:badges
