name: Budget check
on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: Job timeout; allow additional minutes for billing rounding and cleanup
        type: choice
        options: ['2', '5', '8', '10', '15', '20']
        default: '8'
permissions:
  contents: read
concurrency:
  group: budget-check
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) >= 2 && fromJSON(inputs.timeout_minutes) <= 20 && fromJSON(inputs.timeout_minutes) || 2 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the selected cap
        run: |
          case "$BRRP_TIMEOUT_MINUTES" in
            2|5|8|10|15|20) ;;
            *) echo 'Select a supported timeout between 2 and 20 minutes.' >&2; exit 1 ;;
          esac
        env:
          BRRP_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - name: Frontend checks
        working-directory: web
        run: |
          npm run check
          npm run format:check
          npm test
      - name: Static audits and browser failure controls
        run: |
          node scripts/ci-audit.mjs
          node scripts/check-browser-steps.mjs --self-test
          node scripts/check-browser-steps.mjs
      - run: go build ./cmd/brrpbrrp
      - name: Linux Go tests (without race detector)
        run: go test -count=1 -timeout "${BRRP_TIMEOUT_MINUTES}m" ./...
        env:
          BRRP_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
      - name: Record the scope of this run
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          This is a capped, partial Linux verification. It cannot qualify or package a release.

          Windows/macOS, race detection, real browser journeys, vulnerability scanning,
          Docker, recovery, rollback and package-consumer checks require the full **Check** workflow.
          EOF
