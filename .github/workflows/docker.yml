name: Docker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firefox-audio-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install the exact Firefox test runtime
        run: |
          npm ci --prefix web
          cd web
          npx playwright install --with-deps firefox
      - name: Write the isolated audio startup probe
        run: |
          cat > "$RUNNER_TEMP/audio-probe.mjs" <<'JS'
          import { createServer } from 'node:http';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { writeFileSync } from 'node:fs';
          const { firefox } = await import(pathToFileURL(resolve('web/node_modules/playwright-core/index.mjs')).href);
          const server = createServer((req,res) => res.end('<button id="join">Join voice</button>'));
          await new Promise(r => server.listen(0,'127.0.0.1',r));
          const browser = await firefox.launch({headless:true,firefoxUserPrefs:{'media.volume_scale':'0.0'}});
          try {
            const page=await browser.newPage();
            await page.goto(`http://127.0.0.1:${server.address().port}`);
            await page.evaluate(() => {
              window.probe={secure:isSecureContext,applicationResume:false,captureEntered:false,captureResume:false};
              document.querySelector('#join').onclick=async () => {
                const p=window.probe;p.userActivation=navigator.userActivation?.isActive;
                p.application=new AudioContext();p.applicationInitial=p.application.state;
                try {
                  await p.application.resume();p.applicationResume=true;
                  p.captureEntered=true;p.capture=new AudioContext();p.captureInitial=p.capture.state;
                  await p.capture.resume();p.captureResume=true;
                  const oscillator=p.capture.createOscillator();const destination=p.capture.createMediaStreamDestination();
                  oscillator.connect(destination);oscillator.start();p.stream=destination.stream;
                } catch(e) {p.error=e.name+': '+e.message;}
              };
            });
            await page.locator('#join').click();
            await page.waitForTimeout(3000);
            const result=await page.evaluate(() => {
              const p=window.probe;
              return {secure:p.secure,userActivation:p.userActivation,applicationInitial:p.applicationInitial,applicationResume:p.applicationResume,applicationState:p.application?.state,applicationTime:p.application?.currentTime,captureEntered:p.captureEntered,captureInitial:p.captureInitial,captureResume:p.captureResume,captureState:p.capture?.state,captureTime:p.capture?.currentTime,trackState:p.stream?.getAudioTracks()[0]?.readyState,error:p.error};
            });
            console.log(JSON.stringify(result));writeFileSync(process.argv[2],JSON.stringify(result));
          } finally {await browser.close();await new Promise(r=>server.close(r));}
          JS
      - name: Probe the default runner audio backend
        run: node "$RUNNER_TEMP/audio-probe.mjs" "$RUNNER_TEMP/audio-before.json"
      - name: Start a disposable silent audio sink
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=brrpbrrp_ci
          pactl set-default-sink brrpbrrp_ci
          pactl set-default-source brrpbrrp_ci.monitor
      - name: Probe the same Firefox configuration with the silent sink
        run: node "$RUNNER_TEMP/audio-probe.mjs" "$RUNNER_TEMP/audio-after.json"
      - name: Require actual audio processing after the backend starts
        run: |
          node --input-type=module - "$RUNNER_TEMP/audio-before.json" "$RUNNER_TEMP/audio-after.json" <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const [before,after]=process.argv.slice(2).map(p=>JSON.parse(readFileSync(p)));
          console.log(JSON.stringify({before,after}));
          assert.equal(after.applicationResume,true);assert.ok(after.applicationTime>0);
          assert.equal(after.captureEntered,true);assert.equal(after.captureResume,true);
          assert.ok(after.captureTime>0);assert.equal(after.trackState,'live');
          JS
