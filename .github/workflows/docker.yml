name: Docker
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate Compose configurations
        run: |
          docker compose --env-file .env.docker.example config --quiet
          docker compose --env-file .env.docker.example -f compose.yaml -f compose.turn.yaml config --quiet
          BRRP_BACKUP_HOST_DIR=/tmp/brrpbrrp-backup-ci docker compose --env-file .env.docker.example -f compose.yaml -f compose.backup.yaml config --quiet
          BRRP_BACKUP_HOST_DIR=/tmp/brrpbrrp-backup-ci docker compose --env-file .env.docker.example -f compose.yaml -f compose.turn.yaml -f compose.backup.yaml config --quiet
      - name: Check Dockerfile
        run: docker buildx build --check .
      - name: Build x64 image
        run: docker buildx build --platform linux/amd64 --load -t brrpbrrp:ci .
      - name: Test container lifecycle and persistent data
        run: node scripts/check-docker.mjs brrpbrrp:ci
      - name: Build ARM64 image
        run: docker buildx build --platform linux/arm64 --output type=oci,dest=/tmp/brrpbrrp-arm64.oci.tar .
